  - 主机适配层（Host Adapters）: root_2/root_2_host_adapters.md
  - 工具调用视图（Tool Views）: root_2/root_2_tool_views.md
  - 客户端核心（root_2_client_core）: root_2/root_2_client_core.md
  - 控制台远程客户端（console-remote Client 侧）: root_2/root_2_console_remote.md
- root_3：Worktree 客户端控制台 UI（评审、设置与目标胶囊）:
  - root_3：Worktree 客户端控制台 UI（评审、设置与目标胶囊）: root_3.md
