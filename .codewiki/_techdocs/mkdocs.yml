site_name: dsh-git-worktree
site_description: dsh-git-worktree 是运行在 DeepSeek Harness（DSH）之上的 Git Worktree 插件。它的目标是把「会话、项目与受管 Worktree」之间的绑定关系，实现为一套可持久化、可并发、可崩溃恢复的隔离交付机制：模型在受管 Worktree 中写代码，结果以可复核、可回滚、可恢复的…
