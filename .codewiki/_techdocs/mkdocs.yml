site_name: dsh-git-worktree
site_description: dsh-git-worktree 是一个面向 DeepSeek Harness（DSH）的插件：它让单个会话在隔离的 Git Worktree 中工作，并在「创建 → 编辑 → 评审 → 交付 → 清理」的完整生命周期里保证 Local checkout 的工作区、索引与 HEAD 不被污染。插件以 Cordis…
repo_url: https://github.com/wloops/dsh-git-worktree
edit_uri: ''
docs_dir: docs
